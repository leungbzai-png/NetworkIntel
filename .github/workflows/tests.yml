name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal runtime deps
        # 测试默认零网络；仅需 config_loader 的 pyyaml 与导入链中的 requests
        run: python -m pip install --upgrade pip pyyaml requests

      - name: Run test suite (no network)
        run: python tests/run_tests.py
