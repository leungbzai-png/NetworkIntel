global:
  base_dir: E:\NetworkIntel
  db_path: E:\NetworkIntel\live\intel.db
  snapshots_dir: E:\NetworkIntel\snapshots
  gdrive_sync_dir: E:\NetworkIntel\gdrive_sync
  cache_dir: E:\NetworkIntel\cache
  logs_dir: E:\NetworkIntel\logs
  log_level: INFO
  theme: system
sources:
  geoip:
    enabled: true
    schedule: 0 3 1 * *
    snapshot_category: geoip
    license_key: ${MAXMIND_LICENSE_KEY}
    urls:
      city: https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key={license_key}&suffix=tar.gz
      asn: https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-ASN&license_key={license_key}&suffix=tar.gz
    description: MaxMind GeoLite2 城市+ASN数据库
    warn_after_days: 35
  ip2asn:
    enabled: true
    schedule: 0 2 * * 1
    snapshot_category: bgp
    url: https://iptoasn.com/data/ip2asn-combined.tsv.gz
    description: ip2asn 全球ASN+BGP前缀映射
    warn_after_days: 10
  rir_delegated:
    enabled: true
    schedule: 0 2 1 * *
    snapshot_category: registry
    urls:
      arin: https://ftp.arin.net/pub/stats/arin/delegated-arin-extended-latest
      ripe: https://ftp.ripe.net/pub/stats/ripencc/delegated-ripencc-extended-latest
      apnic: https://ftp.apnic.net/stats/apnic/delegated-apnic-extended-latest
      lacnic: https://ftp.lacnic.net/pub/stats/lacnic/delegated-lacnic-extended-latest
      afrinic: https://ftp.afrinic.net/pub/stats/afrinic/delegated-afrinic-extended-latest
    description: 五大RIR IP分配记录
    warn_after_days: 35
  rpki:
    enabled: true
    schedule: 0 1 * * 1
    snapshot_category: bgp
    url: https://rpki.cloudflare.com/rpki.json
    description: Cloudflare RPKI验证数据
    warn_after_days: 10
  cloud_aws:
    enabled: true
    schedule: 0 4 1 * *
    snapshot_category: registry
    url: https://ip-ranges.amazonaws.com/ip-ranges.json
    description: AWS IP ranges
    warn_after_days: 35
  cloud_azure:
    enabled: true
    schedule: 0 4 1 * *
    snapshot_category: registry
    url: https://download.microsoft.com/download/7/1/D/71D86715-5596-4529-9B13-DA13A5DE5B63/ServiceTags_Public_20240101.json
    description: Azure Service Tags IP ranges
    warn_after_days: 35
  cloud_gcp:
    enabled: true
    schedule: 0 4 1 * *
    snapshot_category: registry
    url: https://www.gstatic.com/ipranges/cloud.json
    description: Google Cloud IP ranges
    warn_after_days: 35
  cloud_cloudflare:
    enabled: true
    schedule: 0 4 1 * *
    snapshot_category: registry
    urls:
      v4: https://www.cloudflare.com/ips-v4
      v6: https://www.cloudflare.com/ips-v6
    description: Cloudflare IP ranges
    warn_after_days: 35
  cloud_hetzner:
    enabled: true
    schedule: 0 4 1 * *
    snapshot_category: registry
    url: https://robot.hetzner.com/assets/hetzner_ips.json
    description: Hetzner IP ranges
    warn_after_days: 35
  cloud_vultr:
    enabled: true
    schedule: 0 4 1 * *
    snapshot_category: registry
    url: https://geofeed.constant.com/?json
    description: Vultr IP ranges
    warn_after_days: 35
  tor_exits:
    enabled: true
    schedule: 0 */6 * * *
    snapshot_category: threats
    url: https://check.torproject.org/torbulkexitlist
    description: Tor出口节点列表
    warn_after_days: 1
  vpn_x4bnet:
    enabled: true
    schedule: 0 3 1 * *
    snapshot_category: threats
    url: https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/vpn/ipv4.txt
    description: X4BNet VPN出口IP列表
    warn_after_days: 35
  spamhaus_drop:
    enabled: true
    schedule: 0 5 * * *
    snapshot_category: threats
    urls:
      drop: https://www.spamhaus.org/drop/drop.txt
      edrop: https://www.spamhaus.org/drop/edrop.txt
    description: Spamhaus DROP + EDROP 黑名单
    warn_after_days: 3
  firehol:
    enabled: true
    schedule: 0 5 * * 1
    snapshot_category: threats
    urls:
      level1: https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level1.netset
      level2: https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level2.netset
      level3: https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level3.netset
    description: FireHOL Level 1-3 恶意IP集合
    warn_after_days: 10
  abusech:
    enabled: true
    schedule: 0 6 * * *
    snapshot_category: threats
    url: https://feodotracker.abuse.ch/downloads/ipblocklist.txt
    description: Abuse.ch Feodo Tracker C2 IP列表
    warn_after_days: 3
  emerging_threats:
    enabled: true
    schedule: 0 6 * * *
    snapshot_category: threats
    url: https://rules.emergingthreats.net/fwrules/emerging-Block-IPs.txt
    description: EmergingThreats 恶意IP封锁列表
    warn_after_days: 3
  peeringdb:
    enabled: false
    schedule: 0 2 1 * *
    snapshot_category: registry
    url: https://peeringdb.com/api/net?depth=2&limit=10000
    description: PeeringDB ASN Peering信息（可选）
    warn_after_days: 35

# ─────────────────────────────────────────────────────────────
# 在线查询 Provider（旁路能力，默认 enabled:false，未接入 query_ip 离线主流程）
# 真实密钥写入 .env（gitignored），此处只放 ${VAR} 占位符。
# 缓存/限速参数实际从 .env 读取（见 .env.example），此处仅作文档参考。
# 详见 docs/ONLINE_PROVIDERS.md / docs/ONLINE_PROVIDER_CACHE_AND_RATE_LIMIT.md
# ─────────────────────────────────────────────────────────────
online_settings:
  online_providers_enabled: false        # 是否参与（未来 query_ip enrichment 开关）
  online_cache_enabled: true             # 旁路结果缓存
  online_cache_db_path: cache/online_cache.sqlite   # 独立 SQLite，不碰 intel.db
  online_rate_limit_enabled: true        # 按 provider 限速 + 429 冷却 + 连续 429 熔断
  online_provider_timeout: 10            # 秒
  online_max_consecutive_429: 3          # 连续 429 达到该值进入熔断
  online_circuit_breaker_seconds: 3600   # 熔断持续时间（秒）
  ttl_days:
    bgpview: 30                          # ASN/BGP：7-30 天
    ipinfo: 14                           # GeoIP：7-30 天
    abuseipdb: 0.25                      # 威胁类：6 小时（=ABUSEIPDB_CACHE_TTL_HOURS）
  # per-provider 默认限速（实际从 ratelimit.DEFAULT_PROVIDER_LIMITS / .env 读取，此处仅文档参考）
  rate_limits:
    bgpview:     { per_minute: 30, per_hour: 1000, per_day: null }
    ipinfo:      { per_minute: 30, per_hour: 500,  per_day: null }
    ip2location: { per_minute: 30, per_hour: 500,  per_day: null }
    abuseipdb:   { per_minute: 10, per_hour: 100,  per_day: 900 }   # 免费额度保护
    threatfox:   { per_minute: 30, per_hour: 500,  per_day: null }

online_providers:
  bgpview:
    enabled: false
    kind: online_query
    category: asn
    requires_api_key: false
    description: BGPView ASN/BGP 在线查询（无需 key）
    timeout: 15
  ipinfo:
    enabled: false
    kind: online_query
    category: geoip
    requires_api_key: true
    token: ${IPINFO_TOKEN}
    description: ipinfo.io 地理/ASN 在线查询
    timeout: 15
  ip2location:
    enabled: false
    kind: online_query
    category: geoip
    requires_api_key: true
    api_key: ${IP2LOCATION_API_KEY}
    description: IP2Location.io 地理在线查询
    timeout: 15
  abuseipdb:
    enabled: false
    kind: online_query
    category: threat_intel
    requires_api_key: true
    api_key: ${ABUSEIPDB_API_KEY}
    description: AbuseIPDB 威胁在线查询（免费约 1000/天，默认 per_day=900 留余量）
    rate_limit: { max_calls: 1000, period_seconds: 86400 }
    cache_ttl_hours: 6                    # 威胁类 TTL 较短
    timeout: 15
  threatfox:
    enabled: false
    kind: online_query
    category: threat_intel
    requires_api_key: true
    api_key: ${THREATFOX_API_KEY}
    description: ThreatFox(abuse.ch) IOC 在线查询（Auth-Key）
    timeout: 15
